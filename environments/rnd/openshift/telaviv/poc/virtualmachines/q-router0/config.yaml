application:
  ignoreDifferences:
    - group: 'kubevirt.io'
      kind: VirtualMachine
      jsonPointers:
      - /spec
    - group: ''
      kind: Secret
      jsonPointers:
      - /spec
  name: "qrouter0"
  componentName: QRouter
  componentIndex: 0
  namespace: "default"
source:
  targetRevision: "master"
  path: "helmcharts/virtualmachines/q-router"
deploy: false
cluster:
  name: "poc"
  environment: "rnd"
  provider: "openshift"
  region: "telaviv"
  project: "virtualmachines"
  adress: "https://kubernetes.default.svc"
