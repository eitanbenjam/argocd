apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "lgtm-smtp-credentials"
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: "global-secret-store"
    kind: ClusterSecretStore
  target:
    name: "lgtm-smtp-credentials"
    creationPolicy: Owner
  data:
    - secretKey: smtp-user
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: "k0s-tools/monitoring/lgtm/smtp"
        metadataPolicy: None
        property: smtp-user
    - secretKey: smtp-password
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: "k0s-tools/monitoring/lgtm/smtp"
        metadataPolicy: None
        property: smtp-password
