k8s-monitoring:
  destinations:
  - name: hostedMetrics
    type: prometheus
    url: "http://mimir.radcom.co.il/api/v1/push"
  - name: hostedLogs
    type: loki
    url: "http://loki.radcom.co.il/loki/api/v1/push"

  alloy-metrics:
    enabled: true
    metrics:
      # -- Rule blocks to be added to the discovery.relabel component for all metric sources.
      # See https://grafana.com/docs/agent/latest/flow/reference/components/discovery.relabel/#rule-block
      extraRelabelingRules: |-
        rule {
          action = "replace"
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label = "node"
        }
        # Add specific labeling for SNMP exporter metrics
        rule {
          source_labels = ["job"]
          regex = "prometheus-snmp-exporter.*"
          target_label = "monitoring_type"
          replacement = "snmp"
        }
        rule {
          source_labels = ["job"]
          regex = "prometheus-snmp-exporter.*"
          target_label = "infrastructure_component"
          replacement = "hp_ilo"
        }

  alloy-operator:
    deploy: true
    crds:
      deployAlloyCRD: true
      deployPodLogsCRD: true
  alloy-logs:
    enabled: true
  alloy-singleton:
    enabled: true
  autoInstrumentation:
    enabled: false

  annotationAutodiscovery:
    enabled: true
    annotations:
      scrape: prometheus.io/scrape
      metricsPath: prometheus.io/path
      metricsPortNumber: prometheus.io/port

  clusterMetrics:
    enabled: true
    kube-state-metrics:
      enabled: true
      metricLabelsAllowlist:
        - namespaces=[*]
      metricAnnotationsAllowList:
        - namespaces=[*]
      metricsTuning:
        includeMetrics:
          - kube_deployment_status_replicas_unavailable
          - kube_namespace_annotations
          - kube_namespace_created
          - kube_namespace_labels
          - kube_node_labels
          - kube_pod_container_resource_limits
          - kube_pod_container_resource_requests
          - kube_pod_container_status_restarts_total
          - kube_pod_info
          - kube_pod_status_qos_class
    kubelet:
      enabled: true
      metricsTuning:
        includeMetrics:
          - kubelet_node_name
          - kubelet_running_pod_count
          - kubelet_runtime_operations_total
          - kubelet_volume_stats_available_bytes
          - kubelet_volume_stats_capacity_bytes
          - kubelet_volume_stats_inodes
          - kubelet_volume_stats_inodes_used
          - kubelet_volume_stats_used_bytes
    node-exporter:
      enabled: true
      metricsTuning:
        includeMetrics:
          - node_boot_time_seconds
          - node_context_switches_total
          - node_cpu_core_throttles_total
          - node_cpu_seconds_total
          - node_disk_io_now
          - node_disk_read_bytes_total
          - node_disk_reads_completed_total
          - node_disk_writes_completed_total
          - node_disk_written_bytes_total
          - node_filefd_allocated
          - node_filefd_maximum
          - node_filesystem_avail_bytes
          - node_filesystem_device_error
          - node_filesystem_files
          - node_filesystem_files_free
          - node_filesystem_size_bytes
          - node_intr_total
          - node_load1
          - node_load1
          - node_load15
          - node_load5
          - node_memory_Buffers_bytes
          - node_memory_Cached_bytes
          - node_memory_MemFree_bytes
          - node_memory_MemTotal_bytes
          - node_memory_Slab_bytes
          - node_memory_SReclaimable_bytes
          - node_memory_SUnreclaim_bytes
          - node_memory_SwapFree_bytes
          - node_memory_SwapTotal_bytes
          - node_netstat_Tcp_CurrEstab
          - node_network_receive_bytes_total
          - node_network_receive_drop_total
          - node_network_receive_errs_total
          - node_network_receive_packets_total
          - node_nf_conntrack_entries
          - node_time_seconds
          - node_timex_estimated_error_seconds
          - node_timex_maxerror_seconds
          - node_uname_info
    cadvisor:
      enabled: true
      metricsTuning:
        includeMetrics:
          - container_cpu_cfs_throttled_seconds_total
          - container_cpu_usage_seconds_total
          - container_memory_working_set_bytes
          - container_network_receive_errors_total
          - container_oom_events_total
          - machine_cpu_cores
    controlPlane:
      enabled: true
    windows-exporter:
      enabled: false
      deploy: false
    kepler:
      enabled: true
    opencost:
      enabled: true
      metricsSource: "custom"
      opencost:
        prometheus:
          external:
            enabled: true
            url: "http://mimir.radcom.co.il/prometheus" # Ensure this URL is correct

  prometheusOperatorObjects:
    enabled: true
    serviceMonitors:
      enabled: true
    podMonitors:
      enabled: true

  integrations:
    etcd:
      instances:
      - name: k8s-controlplane-etcd
        labelSelectors:
          app.kubernetes.io/component: etcd
    alloy:
      instances:
      - name: alloy
        labelSelectors:
          app.kubernetes.io/name: alloy-metrics
    mimir:
      instances:
        - name: mimir
          labelSelectors:
            app.kubernetes.io/name: mimir
          logs:
            enabled: true
    loki:
      instances:
        - name: loki
          labelSelectors:
            app.kubernetes.io/name: loki
          logs:
            enabled: true
    prometheus-snmp-exporter:
      instances:
        - name: prometheus-snmp-exporter
          labelSelectors:
            app.kubernetes.io/name: prometheus-snmp-exporter
          # Remove metricsTuning to allow ALL metrics through
          # metricsTuning:
          #   includeMetrics: []

  clusterEvents:
    enabled: true

  podLogs:
    enabled: true

  nodeLogs:
    enabled: true
