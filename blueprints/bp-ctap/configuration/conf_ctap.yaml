ctap-mgr-ms-chart:
  resources:
    limits:
      cpu: 100m
      memory: 200Mi
    requests:
      cpu: 100m
      memory: 200Mi

  metrics:
    prometheusPort: 10090

  service:
    port: 80

  bp_registration:
    enabled: false
    ip: ""
    version: ""

  persistence:
    storageClassName: standard
    storageSize: 1Gi

  config:
    listen:
      port: 80
    k8s_watched_namespaces: []
    # Options
    LogLevel: "INFO" # DEBUG/INFO
    NetworkIpMode: ipv6 #uvicorn host will be "::" when NetworkIpMode = ipv6 or "0.0.0.0" if NetworkIpMode = ipv4
    SiteName: ""
    SiteType: ""
    ClusterName: ""


ctap-agent-ms-chart:
  resources:
    limits:
      cpu: 100m
      memory: 200Mi
    requests:
      cpu: 100m
      memory: 200Mi

  config:
    # The network interface on each node used to send packets
    out_interface: eth0

    k8s_watched_namespaces: []
    LogLevel: "INFO" # DEBUG/INFO
    NetworkIpMode: ipv6
    SiteName: ""
    SiteType: ""
    ClusterName: ""
