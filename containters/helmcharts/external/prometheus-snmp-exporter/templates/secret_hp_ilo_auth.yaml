apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "hp-ilo-auth"
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: "global-secret-store"
    kind: ClusterSecretStore
  target:
    name: "hp-ilo-auth"
    creationPolicy: Owner
  data:
    - secretKey: SNMP_COMMUNITY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: "k0s-tools/monitoring/snmp-exporter/hp-ilo"
        metadataPolicy: None
        property: snmp-community
    - secretKey: SNMP_USERNAME
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: "k0s-tools/monitoring/snmp-exporter/hp-ilo"
        metadataPolicy: None
        property: snmp-username
    - secretKey: SNMP_PASSWORD
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: "k0s-tools/monitoring/snmp-exporter/hp-ilo"
        metadataPolicy: None
        property: snmp-password
    - secretKey: SNMP_PRIV_PASSWORD
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: "k0s-tools/monitoring/snmp-exporter/hp-ilo"
        metadataPolicy: None
        property: snmp-priv-password
