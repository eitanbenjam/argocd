apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    helm.sh/chart: radcom-ingress-nginx-chart-1.16.0
    app.kubernetes.io/name: radcom-ingress-nginx-chart
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "1.8.0"
    app.kubernetes.io/part-of: radcom-ingress-nginx-chart
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: controller
  name: radcom-ingress-nginx-chart-controller
  namespace: default
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: radcom-ingress-nginx-chart
      app.kubernetes.io/instance: release-name
      app.kubernetes.io/component: controller
  revisionHistoryLimit: 10
  minReadySeconds: 0
  template:
    metadata:
      annotations:
        prometheus.io/port: "10254"
        prometheus.io/scrape: "true"
      labels:
        helm.sh/chart: radcom-ingress-nginx-chart-1.16.0
        app.kubernetes.io/name: radcom-ingress-nginx-chart
        app.kubernetes.io/instance: release-name
        app.kubernetes.io/version: "1.8.0"
        app.kubernetes.io/part-of: radcom-ingress-nginx-chart
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: controller
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: controller
          image: "nexus3-prod.radcom.co.il:8084/registry.k8s.io/ingress-nginx/controller:v1.8.0"
          imagePullPolicy: Always
          lifecycle: 
            preStop:
              exec:
                command:
                - /wait-shutdown
          args:
            - /nginx-ingress-controller
            - --election-id=radcom-ingress-nginx-chart-leader
            - --controller-class=k8s.io/ingress-nginx
            - --ingress-class=nginx
            - --configmap=$(POD_NAMESPACE)/radcom-ingress-nginx-chart-controller
            - --tcp-services-configmap=$(POD_NAMESPACE)/radcom-ingress-nginx-chart-tcp
            - --udp-services-configmap=$(POD_NAMESPACE)/radcom-ingress-nginx-chart-udp
            - --watch-namespace=$(POD_NAMESPACE)
            - --validating-webhook=:8443
            - --validating-webhook-certificate=/usr/local/certificates/cert
            - --validating-webhook-key=/usr/local/certificates/key
            - --watch-ingress-without-class=true
            - --default-ssl-certificate=$(POD_NAMESPACE)/tls-secret
            - --publish-status-address=kuberiq-home-vip
          securityContext: 
            capabilities:
              drop:
              - ALL
              add:
              - NET_BIND_SERVICE
            runAsUser: 101
            allowPrivilegeEscalation: true
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LD_PRELOAD
              value: /usr/local/lib/libmimalloc.so
          livenessProbe: 
            failureThreshold: 5
            httpGet:
              path: /healthz
              port: 10254
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          readinessProbe: 
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 10254
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
            - name: metrics
              containerPort: 10254
              protocol: TCP
            - name: webhook
              containerPort: 8443
              protocol: TCP
            - name: 30093-tcp
              containerPort: 30093
              protocol: TCP
            - name: 30201-tcp
              containerPort: 30201
              protocol: TCP
            - name: 30202-tcp
              containerPort: 30202
              protocol: TCP
            - name: 30203-tcp
              containerPort: 30203
              protocol: TCP
            - name: 30204-tcp
              containerPort: 30204
              protocol: TCP
            - name: 30205-tcp
              containerPort: 30205
              protocol: TCP
            - name: 30206-tcp
              containerPort: 30206
              protocol: TCP
            - name: 30207-tcp
              containerPort: 30207
              protocol: TCP
            - name: 30208-tcp
              containerPort: 30208
              protocol: TCP
            - name: 30209-tcp
              containerPort: 30209
              protocol: TCP
            - name: 30210-tcp
              containerPort: 30210
              protocol: TCP
            - name: 5353-udp
              containerPort: 5353
              protocol: UDP
          volumeMounts:
            - name: webhook-cert
              mountPath: /usr/local/certificates/
              readOnly: true
          resources: 
            limits:
              cpu: 5
              memory: 10Gi
            requests:
              cpu: 100m
              memory: 90Mi
      nodeSelector: 
        kubernetes.io/os: linux
      serviceAccountName: radcom-ingress-nginx-chart
      terminationGracePeriodSeconds: 300
      volumes:
        - name: webhook-cert
          secret:
            secretName: radcom-ingress-nginx-chart-admission
