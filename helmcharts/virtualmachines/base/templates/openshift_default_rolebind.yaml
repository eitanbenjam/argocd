apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
  labels:
    app.kubernetes.io/managed-by: Helm
  name: radcom-default-rolebinding
  namespace: {{ .Values.general.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: radcom-default-role
subjects:
- kind: ServiceAccount
  name: default
  namespace: {{ .Values.general.namespace }}
