DOCKER_REGISTRY_PLACEHOLDER: &DOCKER_REGISTRY_PLACEHOLDER 692859913461.dkr.ecr.us-east-2.amazonaws.com

cs-k8s-infra:
  radcom-ingress-nginx-chart:
    enabled: false
    controller:
      kind: Deployment
      admissionWebhooks:
        enabled: true
        patch:
          enabled: true
          image:
            digest: false
            registry: *DOCKER_REGISTRY_PLACEHOLDER
      hostNetwork: false
      image:
        digest: false
        registry: *DOCKER_REGISTRY_PLACEHOLDER
      publishService:
        enabled: false
        # pathOverride: "radcom-ingress-nginx-chart/radcom-ingress-nginx-chart-controller"
      # extraArgs:
      #   publish-status-address: ""
      #   report-node-internal-ip-address: false
      service:
        enabled: true
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
          service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: '60'
          service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
      #    service.beta.kubernetes.io/aws-load-balancer-type: nlb
          # service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: Name=internal-{{ .Values.deployment_name }}
          service.beta.kubernetes.io/aws-load-balancer-subnets: 'subnet-0846e189a8b988748,subnet-0cf9aefd1d9e15526'
          service.beta.kubernetes.io/aws-load-balancer-scheme: internal
          service.beta.kubernetes.io/load-balancer-source-ranges: '0.0.0.0/0'
          service.beta.kubernetes.io/aws-load-balancer-internal: 'true'
          service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
        nodePorts:
          https: 30443
          http: 30080
      ingressClassResource:
        enabled: false
      #   name: nginx
      #   # controllerValue: "k8s.io/ingress-nginx"
      #   default: true
  service-access-config-chart:
    radcomConfiguration:
      conductorIp: *CONDUCTOR_VIP_PLACEHOLDER
    autoDiscovery:
      condcutorDnsName: *CONDUCTOR_VIP_PLACEHOLDER
      isLocalFilesAvailable: false
      systemOrchestrationMode: ""
    legacyConf:
    - interface: oam_direct
      ipType: ip
      name: kafka
      port: '9092'
      preferredIp: v4
      siteType: home
      type: kafka
    - interface: oam_direct
      ipType: ip
      name: kafka-ext
      port: '9093'
      siteType: home
      type: kafka
    - interface: oam_direct
