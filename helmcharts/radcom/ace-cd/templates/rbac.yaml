{{- if .Values.rbac.create }}
{{- if .Values.rbac.useClusterRole }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ace-cd.fullname" . }}-service-account
  labels:
    {{- include "ace-cd.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["endpoints"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ace-cd.fullname" . }}-service-account
  labels:
    {{- include "ace-cd.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ace-cd.fullname" . }}-service-account
subjects:
- kind: ServiceAccount
  name: {{ index .Values "ace-cd" "ace-cd-chart" "cloud" "service_account_name" | default "cicd-cluster-eks-role" }}
  namespace: {{ index .Values "ace-cd" "ace-cd-chart" "namespace" | default .Release.Namespace }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ace-cd.fullname" . }}-service-account
  namespace: {{ index .Values "ace-cd" "ace-cd-chart" "namespace" | default .Release.Namespace }}
  labels:
    {{- include "ace-cd.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["endpoints"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ace-cd.fullname" . }}-service-account
  namespace: {{ index .Values "ace-cd" "ace-cd-chart" "namespace" | default .Release.Namespace }}
  labels:
    {{- include "ace-cd.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ace-cd.fullname" . }}-service-account
subjects:
- kind: ServiceAccount
  name: {{ index .Values "ace-cd" "ace-cd-chart" "cloud" "service_account_name" | default "cicd-cluster-eks-role" }}
  namespace: {{ index .Values "ace-cd" "ace-cd-chart" "namespace" | default .Release.Namespace }}
{{- end }}
{{- end }}
