apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: k0stools-core-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=invalid"]
  generators:
    - matrix:
        generators:
          - git:
              repoURL:  https://github.com/eitanbenjam/argocd
              revision: gcp
              files:
                - path: 'environments/**/config.yaml'
          - clusters:
              selector:
                matchLabels:
                  cluster: 'gcp'
                  region: 'eitan'
                  provider: 'gcp'
                  environment: 'rnd'
      selector:
        matchExpressions:
        - key: deploy
          operator: In
          values:
            - "true"
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  template:
    metadata:
      name: '{{.cluster.name}}-{{.cluster.project}}-{{.application.name}}{{or .application.nameSuffix "" | replace "/" "-"}}'
      labels:
        app.kubernetes.io/component: argocd-application
        app.kubernetes.io/part-of: '{{.cluster.name}}'
        kubernetes.io/environment: '{{.cluster.environment}}'
        provider: '{{.cluster.provider}}'
        topology.kubernetes.io/region: '{{.cluster.region}}'
    spec:
      project: default
      source:
        repoURL: '{{.source.repoURL}}'
        targetRevision: '{{.source.targetRevision}}'
        path: '{{.source.path}}'
        helm:
          skipCrds: true
          releaseName: "{{.application.name}}"
          valueFiles:
          # https://argo-cd.readthedocs.io/en/stable/user-guide/multiple_sources/#helm-value-files-from-external-git-repository
            - "values.yaml"
            - '../../../environments/{{.cluster.environment}}/values.yaml'
            - '../../../environments/{{.cluster.environment}}/{{.cluster.provider}}/values.yaml'
            - '../../../environments/{{.cluster.environment}}/{{.cluster.provider}}/{{.cluster.region}}/values.yaml'
            - '../../../environments/{{.cluster.environment}}/{{.cluster.provider}}/{{.cluster.region}}/{{.cluster.name}}/values.yaml'
            - '../../../environments/{{.cluster.environment}}/{{.cluster.provider}}/{{.cluster.region}}/{{.cluster.name}}/{{.cluster.project}}/values.yaml'
            - '../../../environments/{{.cluster.environment}}/{{.cluster.provider}}/{{.cluster.region}}/{{.cluster.name}}/{{.cluster.project}}/{{.path.basenameNormalized}}{{or .application.nameSuffix "" }}/values.yaml'
      destination:
        server: '{{.server}}'
        namespace: "{{.application.namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ServerSideDiff=true
        retry:
          limit: 2
  # add template https://github.com/argoproj/argo-cd/issues/17637
  templatePatch: |
    {{- if eq .application.deploymentMethod "kustomize" }}
      spec:
        source:
          path: {{ .source.kustomizePath }}
          helm: null
    {{- end }}
    {{- if or .application.syncPolicy.automated .application.ignoreDifferences }}
      spec:
      {{- if .application.ignoreDifferences }}
        ignoreDifferences: {{ .application.ignoreDifferences | toJson }}
      {{- end }}
      {{- if .application.syncPolicy }}
        syncPolicy:
          {{- if .application.syncPolicy.automated }}
          automated:
          {{- if .application.syncPolicy.automated.allowEmpty }}
            allowEmpty: {{ .application.syncPolicy.automated.allowEmpty }}
          {{- end }}
          {{- if .application.syncPolicy.automated.prune }}
            prune: {{ .application.syncPolicy.automated.prune }}
          {{- end }}
          {{- if .application.syncPolicy.automated.selfHeal }}
            selfHeal: {{ .application.syncPolicy.automated.selfHeal}}
          {{- end }}
        {{- end }}
      {{- end }}
    {{- end }}
  syncPolicy:
    applicationsSync: create-update
