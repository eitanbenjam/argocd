application:
  name: "prometheus-snmp-exporter"
  namespace: "collector"
  ignoreDifferences:
      - group: "monitoring.coreos.com"
        kind: "ServiceMonitor"
        jsonPointers:
          - "/spec/endpoints/0/relabelings"
source:
  repoURL: "ssh://git@bitbucket-prod.radcom.co.il:7999/devopstools/helmcharts.git"
  targetRevision: "master"
  path: "helmcharts/external/prometheus-snmp-exporter"
deploy: true
cluster:
  name: "k0stools"
  environment: "rnd"
  provider: "vsphere"
  region: "telaviv"
  project: "core"
  adress: "https://kubernetes.default.svc"
