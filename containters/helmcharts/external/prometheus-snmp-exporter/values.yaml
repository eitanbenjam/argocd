# Prometheus SNMP Exporter configuration for HP iLO monitoring
prometheus-snmp-exporter:
  # Enable environment variable expansion for authentication
  extraArgs:
    - "--config.expand-environment-variables"
    - "--log.level=debug"

  # Environment variables for authentication from External Secrets
  envFrom:
    - secretRef:
        name: hp-ilo-auth

  configmapReload:
    enabled: true

  # SNMP configuration for HP iLO servers
  config: |-
    auths:
      hp_ilo_v2:
        community: "${SNMP_COMMUNITY}"
        version: 2
      hp_ilo_v3:
        username: "${SNMP_USERNAME}"
        password: "${SNMP_PASSWORD}"
        priv_password: "${SNMP_PRIV_PASSWORD}"
        auth_protocol: SHA
        priv_protocol: AES
        security_level: authPriv
        version: 3

    modules:
      # HPE Compaq Hardware Monitoring
      hpe:
        walk:
        - 1.3.6.1.4.1.232.2.2.4.2
