argo-cd:
  ## Argo CD configuration
  ## Ref: https://github.com/argoproj/argo-cd
  ##

  # -- Provide a name in place of `argocd`
  nameOverride: "argo-cd"
  # -- String to fully override `"argo-cd.fullname"`
  fullnameOverride: "argo-cd"

  ## Globally shared configuration
  global:
    # -- Default domain used by all components
    ## Used for ingresses, certificates, SSO, notifications, etc.
    domain: argocd.radcom.co.il

  ## Argo Configs
  configs:
    # General Argo CD configuration
    ## Ref: https://github.com/argoproj/argo-cd/blob/master/docs/operator-manual/argocd-cm.yaml
    cm:
      # -- Create the argocd-cm configmap for [declarative setup]
      create: true

      # enable terminal access for pods from argo UI
      exec.enabled: true

      # OIDC configuration as an alternative to dex (optional).
      oidc.config: |
        name: AzureAD
        issuer: https://login.microsoftonline.com/0eb9e2d9-8763-412e-9709-3f539e9e25bc/v2.0
        clientID: a148ed9a-acc6-4753-91b4-a243779473a0
        clientSecret: $oidc.azure.clientSecret
        requestedIDTokenClaims:
          groups:
            essential: true
        requestedScopes:
          - openid
          - profile
          - email
      extension.config: |-
        extensions:
          - name: metrics
            backend:
              services:
                - url: http://argocd-server-metrics.argocd.svc:9003
    # Argo CD RBAC policy configuration
    ## Ref: https://github.com/argoproj/argo-cd/blob/master/docs/operator-manual/rbac.md
    rbac:
      # -- Create the argocd-rbac-cm configmap with ([Argo CD RBAC policy]) definitions.
      # If false, it is expected the configmap will be created by something else.
      # Argo CD will not work if there is no configmap created with the name above.
      create: true

      # -- Annotations to be added to argocd-rbac-cm configmap
      annotations: {}

      # -- The name of the default role which Argo CD will falls back to, when authorizing API requests (optional).
      # If omitted or empty, users may be still be able to login, but will see no apps, projects, etc...
      policy.default: 'role:readonly'

      # -- File containing user-defined policies and role definitions.
      # @default -- `''` (See [values.yaml])

      # policy.csv: ''
      # Policy rules are in the form:
      #  p, subject, resource, action, object, effect
      # Role definitions and bindings are in the form:
      #  g, subject, inherited-subject
      policy.csv: |
        p, role:org-admin, applications, *, */*, allow
        p, role:org-admin, clusters, get, *, allow
        p, role:org-admin, repositories, *, *, allow
        p, role:org-admin, logs, get, *, allow
        p, role:org-admin, exec, create, */*, allow
        g, "2a0d236c-0efd-4982-a958-5501f9d29f81", role:org-admin
        p, role:readonly, extensions, invoke, metrics, allow
        p, role:readonly, *, get, *, allow

      # -- OIDC scopes to examine during rbac enforcement (in addition to `sub` scope).
      # The scope value can be a string, or a list of strings.
      scopes: "[groups]"

      # -- Matcher function for Casbin, `glob` for glob matcher and `regex` for regex matcher.
      policy.matchMode: "glob"

    params:
      server.enable.proxy.extension: "true"
  ## Server
  server:
    # TLS certificate configuration via cert-manager
    ## Ref: https://argo-cd.readthedocs.io/en/stable/operator-manual/tls/#tls-certificates-used-by-argocd-server
    certificate:
      # -- Deploy a Certificate resource (requires cert-manager)
      enabled: false
      # -- Certificate primary domain (commonName)
      # @default -- `""` (defaults to global.domain)
      domain: "argocd.radcom.co.il"

    # Argo CD server ingress configuration
    ingress:
      # -- Enable an ingress resource for the Argo CD server
      enabled: true
      # -- Specific implementation for ingress controller. One of `generic`, `aws` or `gke`
      ## Additional configuration might be required in related configuration sections
      controller: generic
      # -- Additional ingress labels
      labels: {}
      # -- Additional ingress annotations
      ## Ref: https://argo-cd.readthedocs.io/en/stable/operator-manual/ingress/#option-1-ssl-passthrough
      annotations:
        nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
        nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"

      # -- Defines which ingress controller will implement the resource
      ingressClassName: "nginx"

      # -- Enable TLS configuration for the hostname defined at `server.ingress.hostname`
      ## TLS certificate will be retrieved from a TLS secret `argocd-server-tls`
      ## You can create this secret via `certificate` or `certificateSecret` option
      tls: true
    extensions:
      # -- Enable support for Argo CD extensions
      enabled: true
      extensionList:
        - name: extension-metrics
          env:
            - name: EXTENSION_URL
              value: https://github.com/argoproj-labs/argocd-extension-metrics/releases/download/v1.0.3/extension.tar.gz
            - name: EXTENSION_CHECKSUM_URL
              value: https://github.com/argoproj-labs/argocd-extension-metrics/releases/download/v1.0.3/extension_checksums.txt
