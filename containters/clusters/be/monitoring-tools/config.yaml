application:
  name: "bp-monitoring-tools"
  namespace: "default"
  ignoreDifferences:
  - group: "apps"
    kind: "StatefulSet"
    jqPathExpressions:
      - ".spec.volumeClaimTemplates[].apiVersion"
      - ".spec.volumeClaimTemplates[].kind"
target:
  targetRevision: "datavolume-cluster"
  path: "containters/helmcharts/bp-monitoring-tools"
deploy: true
cluster:
  name: in-cluster
  adress: "https://kubernetes.default.svc"
