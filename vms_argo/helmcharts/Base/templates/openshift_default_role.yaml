apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
  labels:
    app.kubernetes.io/managed-by: Helm
  name: radcom-default-role
  namespace: {{ .Values.general.namespace }}
rules:
- apiGroups:
  - ""
  resources:
  - endpoints
  verbs:
  - get
  - watch
  - list
  - update
  - patch
