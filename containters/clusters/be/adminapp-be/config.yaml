application:
  name: "bp-adminapp-be"
  namespace: "default"
  ignoreDifferences:
  - group: "apps"
    kind: "StatefulSet"
    jqPathExpressions:
    - ".spec.volumeClaimTemplates[].apiVersion"
    - ".spec.volumeClaimTemplates[].kind"
  - group: "v1"
    kind: "ConfigMap"
    jqPathExpressions:
    - ".data"

target:
  targetRevision: "datavolume-cluster"
  path: "containters/helmcharts/bp-adminapp-be"
deploy: true
cluster:
  name: in-cluster
  adress: "https://kubernetes.default.svc"
