application:
  ignoreDifferences:
    - group: 'kubevirt.io'
      kind: VirtualMachine
      jsonPointers:
      - /spec
    - group: ''
      kind: Secret
      jsonPointers:
      - /spec
  name: "conductor"
  namespace: "default"
target:
  targetRevision: eitan
  path: "vms_argo/helmcharts/Conductor"
deploy: true
cluster:
  name: in-cluster
  address: "https://kubernetes.default.svc"
