apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "admin-password-secret-name"
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: "global-secret-store"
    kind: ClusterSecretStore
  target:
    name: "admin-password-secret-name"
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: "k0s-tools/sonarqube/admin-password"
        metadataPolicy: None
        property: password
    - secretKey: currentPassword
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: "k0s-tools/sonarqube/admin-password"
        metadataPolicy: None
        property: currentPassword
    - secretKey: monitoringPasscodeSecret
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: "k0s-tools/sonarqube/admin-password"
        metadataPolicy: None
        property: monitoringPasscodeSecret
