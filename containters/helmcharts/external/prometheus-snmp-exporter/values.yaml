  # Service configuration
  service:
    type: ClusterIP
    port: 9116

  # ServiceMonitor configuration for Prometheus
  serviceMonitor:
    enabled: true
    interval: 60s
    scrapeTimeout: 30s

    # Additional labels for Mimir routing
    additionalLabels:
      prometheus_instance: "k0s-tools"
      component: "ilo-monitoring"

    relabelings:
      - targetLabel: job
        replacement: "snmp-exporter-hp-ilo"

    params:
      - name: hp-ilo-1
        module:
          - hpe
        auth:
          - hp_ilo_v3
        target: 172.29.60.113

        # additionalMetricsRelabels:
        #   server: "hp-ilo-1"
        #   environment: "production"
        #   ip: "172.29.60.113"
        #   ilo_version: "4"

  # Resource limits
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  # Pod security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
