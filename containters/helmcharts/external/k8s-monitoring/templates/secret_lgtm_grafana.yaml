apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "lgtm-grafana"
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: "global-secret-store"
    kind: ClusterSecretStore
  target:
    name: "lgtm-grafana"
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: "k0s-tools/monitoring/lgtm/grafana"
        metadataPolicy: None
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: "k0s-tools/monitoring/lgtm/grafana"
        metadataPolicy: None
        property: admin-password
